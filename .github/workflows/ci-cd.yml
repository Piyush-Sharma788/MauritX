name: ci-cd pipeline for marutix

# One pipeline, three jobs, run in order:
#
#   codequality  ->  buildandpush  ->  deploy_to_server
#
# codequality       ESLint, TypeScript, unit + MongoDB integration tests, dependency audit, CodeQL.
# buildandpush      Builds the web + worker Docker images, smoke-tests them, and (for pushes to
#                   main or a vX.Y.Z tag) pushes them to ghcr.io/<owner>/marutix-{web,worker}.
# deploy_to_server  Pulls exactly those images on the Docker host over SSH, health-checks the
#                   public URL and rolls back automatically on failure.
#                     push to main   -> staging     (vars.STAGING_DEPLOY_ENABLED == 'true')
#                     tag vX.Y.Z     -> production  (vars.PRODUCTION_DEPLOY_ENABLED == 'true')
#
# Pull requests run codequality and buildandpush (build + smoke test, nothing pushed); deploy is skipped.
# Rollback: open an older successful run and "Re-run" its deploy_to_server job.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ───────────────────────────────────────────── 1. Code quality
  codequality:
    name: codequality
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    services:
      mongodb:
        # Pinned by digest: mongo 9.0.4 (SERVER-131779 fix for kernel ≥6.19).
        image: mongo@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      # Unit tests and every MongoDB integration test. Test secrets are generated by tests/setup.ts;
      # nothing is sent to WhatsApp, Meta, Twilio, email or AI providers.
      - name: Unit & integration tests
        run: npm run test:integration

      - name: Verify package signatures and provenance
        run: npm audit signatures

      # High/critical advisories in production dependencies fail the build unless reviewed in
      # .github/audit-allowlist.json (with an expiry and the only dependency path allowed).
      - name: Production dependency gate
        run: node scripts/audit-gate.mjs

      - name: Dependency review (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      # "actions" also scans this workflow file (injection, unsafe triggers, untrusted checkouts).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript, actions
          build-mode: none
          queries: security-extended

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  # ───────────────────────────────────────────── 2. Build & push images
  buildandpush:
    name: buildandpush
    needs: codequality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    services:
      mongodb:
        # Only for the web container smoke test.
        image: mongo@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    outputs:
      kind: ${{ steps.meta.outputs.kind }}
      push: ${{ steps.meta.outputs.push }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      prefix: ${{ steps.meta.outputs.prefix }}
      web_digest: ${{ steps.push-web.outputs.digest }}
      worker_digest: ${{ steps.push-worker.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image names and tags
        id: meta
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          kind=none; version=""
          if [[ "$REF_TYPE" == "branch" && "$REF_NAME" == "main" ]]; then
            kind=branch
          elif [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            kind=tag; version="${BASH_REMATCH[1]}"
          fi
          # Publish only for main / release tags, never for pull requests.
          push=false
          if [[ "$EVENT" != "pull_request" && "$kind" != "none" ]]; then push=true; fi

          prefix="ghcr.io/${OWNER,,}"
          for image in web worker; do
            name="$prefix/marutix-$image"
            tags="$name:sha-$GITHUB_SHA"
            [[ "$kind" == "branch" ]] && tags+=",$name:main"
            if [[ "$kind" == "tag" ]]; then tags+=",$name:$version,$name:${version%.*}"; fi
            echo "${image}_tags=$tags" >> "$GITHUB_OUTPUT"
          done
          {
            echo "kind=$kind"; echo "push=$push"; echo "prefix=$prefix"; echo "image_tag=sha-$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Commit $GITHUB_SHA · kind $kind · push $push"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ── web image
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: marutix-web:ci
          build-args: |
            WHATSAPP_WEB_PUBLIC_NUMBER=${{ vars.WHATSAPP_WEB_PUBLIC_NUMBER }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke test web image
        run: bash scripts/ci/smoke-web-image.sh marutix-web:ci

      # ── worker image
      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: marutix-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Smoke test worker image
        run: bash scripts/ci/smoke-worker-image.sh marutix-worker:ci

      # ── push (same inputs and cache as the tested builds, so layers are reused)
      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push web image
        id: push-web
        if: steps.meta.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.web_tags }}
          build-args: |
            WHATSAPP_WEB_PUBLIC_NUMBER=${{ vars.WHATSAPP_WEB_PUBLIC_NUMBER }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          provenance: mode=max
          sbom: true

      - name: Push worker image
        id: push-worker
        if: steps.meta.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.worker_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=worker
          provenance: mode=max
          sbom: true

      - name: Summary
        if: steps.meta.outputs.push == 'true'
        shell: bash
        env:
          WEB_DIGEST: ${{ steps.push-web.outputs.digest }}
          WORKER_DIGEST: ${{ steps.push-worker.outputs.digest }}
          WEB_TAGS: ${{ steps.meta.outputs.web_tags }}
          WORKER_TAGS: ${{ steps.meta.outputs.worker_tags }}
        run: |
          set -euo pipefail
          for d in "$WEB_DIGEST" "$WORKER_DIGEST"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::No image digest"; exit 1; }
          done
          {
            echo "### Images pushed"
            echo "| Image | Digest | Tags |"
            echo "|---|---|---|"
            echo "| marutix-web | \`$WEB_DIGEST\` | ${WEB_TAGS//,/<br>} |"
            echo "| marutix-worker | \`$WORKER_DIGEST\` | ${WORKER_TAGS//,/<br>} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────── 3. Deploy
  deploy_to_server:
    name: deploy_to_server
    needs: buildandpush
    # Only published images, and only when the target environment is switched on.
    if: >-
      needs.buildandpush.outputs.push == 'true' &&
      ((needs.buildandpush.outputs.kind == 'branch' && vars.STAGING_DEPLOY_ENABLED == 'true') ||
       (needs.buildandpush.outputs.kind == 'tag' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      # Short-lived pull access for the server when GHCR_READ_TOKEN isn't set.
      packages: read
    environment:
      name: ${{ needs.buildandpush.outputs.kind == 'tag' && 'production' || 'staging' }}
      url: ${{ vars.APP_URL }}
    # One deployment per environment at a time; never cancel one halfway.
    concurrency:
      group: deploy-${{ needs.buildandpush.outputs.kind }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ needs.buildandpush.outputs.kind == 'tag' && 'production' || 'staging' }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      APP_URL: ${{ vars.APP_URL }}
      IMAGE_TAG: ${{ needs.buildandpush.outputs.image_tag }}
      IMAGE_PREFIX: ${{ needs.buildandpush.outputs.prefix }}
      WEB_DIGEST: ${{ needs.buildandpush.outputs.web_digest }}
      WORKER_DIGEST: ${{ needs.buildandpush.outputs.worker_digest }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            deploy
            scripts/ci

      - name: Check configuration
        shell: bash
        env:
          HAS_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
          HAS_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS != '' }}
        run: |
          set -euo pipefail
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH APP_URL; do
            [[ -n "${!name}" ]] || missing+=("variable $name")
          done
          [[ "$HAS_KEY" == "true" ]] || missing+=("secret SSH_PRIVATE_KEY")
          [[ "$HAS_HOSTS" == "true" ]] || missing+=("secret SSH_KNOWN_HOSTS")
          if (( ${#missing[@]} )); then echo "::error::Environment '$DEPLOY_ENV' is missing: ${missing[*]}"; exit 1; fi
          [[ "$APP_URL" == https://* ]] || { echo "::error::APP_URL must start with https://"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "::error::DEPLOY_PATH must be an absolute path"; exit 1; }
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$WORKER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::buildandpush produced no image digests"; exit 1; }

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: never trust on first use.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
            ConnectTimeout 15
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload compose file
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029 # DEPLOY_PATH is validated above and meant to expand here
          ssh deploy-target "mkdir -p '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/.env.production'" \
            || { echo "::error::$DEPLOY_PATH/.env.production is missing on the server (see CI_CD_SETUP.md)"; exit 1; }
          scp -q deploy/docker-compose.prod.yml "deploy-target:$DEPLOY_PATH/docker-compose.yml"
          scp -q scripts/ci/remote-deploy.sh "deploy-target:$DEPLOY_PATH/.marutix-deploy.sh"

      - name: Deploy, health-check and verify (automatic rollback)
        shell: bash
        env:
          GHCR_USER: ${{ vars.GHCR_READ_USER || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Values (including the registry token) go over stdin, never on a command line.
          # shellcheck disable=SC2029 # DEPLOY_PATH is validated above and meant to expand here
          printf 'DEPLOY_PATH=%q\nIMAGE_TAG=%q\nIMAGE_PREFIX=%q\nGHCR_USER=%q\nGHCR_TOKEN=%q\nWEB_DIGEST=%q\nWORKER_DIGEST=%q\n' \
            "$DEPLOY_PATH" "$IMAGE_TAG" "$IMAGE_PREFIX" "$GHCR_USER" "$GHCR_TOKEN" "$WEB_DIGEST" "$WORKER_DIGEST" \
            | ssh deploy-target "bash '$DEPLOY_PATH/.marutix-deploy.sh'"

      - name: Public health check
        shell: bash
        run: |
          set -euo pipefail
          url="${APP_URL%/}/api/health"
          for attempt in $(seq 1 20); do
            body="$(curl -sS --max-time 10 "$url" || true)"
            if [[ "$body" == '{"status":"ok","db":"up"}' ]]; then echo "Healthy after $attempt attempt(s): $body"; exit 0; fi
            sleep 6
          done
          echo "::error::$url did not report {\"status\":\"ok\",\"db\":\"up\"} (last: ${body:-no answer})"
          exit 1

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          base="${APP_URL%/}"
          # TLS, security headers and an authenticated-only admin API on the public URL.
          headers="$(curl -sS --max-time 10 -o /dev/null -D - "$base/")"
          grep -qi '^strict-transport-security:' <<<"$headers" || { echo "::error::Missing HSTS header on $base"; exit 1; }
          grep -qi '^content-security-policy:' <<<"$headers" || { echo "::error::Missing CSP header on $base"; exit 1; }
          code="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$base/api/v1/admin/audit")"
          [[ "$code" == "401" ]] || { echo "::error::Admin API returned $code without a session (expected 401)"; exit 1; }
          # shellcheck disable=SC2029 # DEPLOY_PATH is validated above and meant to expand here
          deployed="$(ssh deploy-target "cat '$DEPLOY_PATH/.deployed-tag'")"
          [[ "$deployed" == "$IMAGE_TAG" ]] || { echo "::error::Server reports $deployed, expected $IMAGE_TAG"; exit 1; }
          echo "Verified $IMAGE_TAG on $base"

      - name: Roll back after a failed public check
        if: failure()
        shell: bash
        env:
          GHCR_USER: ${{ vars.GHCR_READ_USER || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
        run: |
          set -uo pipefail
          [[ -f ~/.ssh/config ]] || { echo "SSH was never configured; nothing to roll back."; exit 0; }
          # shellcheck disable=SC2029 # DEPLOY_PATH is validated above and meant to expand here
          printf 'DEPLOY_PATH=%q\nIMAGE_PREFIX=%q\nGHCR_USER=%q\nGHCR_TOKEN=%q\nMODE=rollback\n' \
            "$DEPLOY_PATH" "$IMAGE_PREFIX" "$GHCR_USER" "$GHCR_TOKEN" \
            | ssh deploy-target "bash '$DEPLOY_PATH/.marutix-deploy.sh'" || echo "::warning::Rollback needs attention on the server"

      - name: Summary
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### Deploy to \`$DEPLOY_ENV\`: $OUTCOME"
            echo "- Image tag: \`$IMAGE_TAG\` (commit \`$GITHUB_SHA\`)"
            echo "- URL: $APP_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH credentials
        if: always()
        run: rm -rf ~/.ssh
