version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      nextjs:
        patterns: [next, eslint-config-next, react, react-dom, "@types/react", "@types/react-dom"]
      whatsapp:
        # Upgrades here can resolve the allowlisted advisories in ci.yml: review that list.
        patterns: [whatsapp-web.js, puppeteer*]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    labels: [dependencies, docker]
    commit-message:
      prefix: docker
